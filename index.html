<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700;900&display=swap" rel="stylesheet">
  <title>Wordle - Türkçe</title>
</head>

<body
  class="bg-[#0f172a] bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-[#0f172a] to-black flex flex-col h-screen w-screen overflow-hidden text-white antialiased font-['Outfit'] selection:bg-emerald-500 selection:text-white pt-[env(safe-area-inset-top)] pb-[env(safe-area-inset-bottom)]">

  <!-- Header -->
  <header
    class="flex items-center justify-center h-16 border-b border-white/10 w-full shrink-0 backdrop-blur-md bg-slate-900/50 relative z-10 shadow-sm">
    <h1
      class="text-4xl font-black tracking-[0.2em] text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 drop-shadow-sm">
      WORDLE</h1>
  </header>

  <!-- Game Container -->
  <main
    class="flex-grow flex flex-col items-center justify-center p-4 w-full max-w-lg mx-auto overflow-hidden relative z-0">

    <!-- Board -->
    <div id="board-container" class="flex items-center justify-center flex-grow min-h-0 w-full py-4">
      <div id="board" class="grid grid-rows-6 grid-cols-5 gap-2 w-full aspect-[5/6] max-h-full max-w-[350px]"></div>
    </div>

  </main>

  <!-- Keyboard -->
  <div class="w-full max-w-lg mx-auto p-2 pb-8 shrink-0">
    <div id="keyboard" class="w-full flex flex-col gap-2"></div>
  </div>

  <!-- Modals/Overlays can go here -->
  <div id="modal-overlay" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full mx-4 text-center transform transition-all scale-100">
      <h2 id="modal-title" class="text-2xl font-bold mb-2">Oyun Bitti</h2>
      <p id="modal-message" class="mb-6 text-gray-600"></p>
      <button id="restart-btn"
        class="bg-indigo-600 text-white px-6 py-2 rounded-full font-semibold hover:bg-indigo-700 transition w-full">
        Tekrar Oyna
      </button>
    </div>
  </div>

  <!-- Welcome Screen -->
  <div id="welcome-screen"
    class="fixed inset-0 bg-[#0f172a]/95 backdrop-blur-xl z-[60] flex flex-col items-center justify-center p-4">
    <div
      class="max-w-md w-full text-center space-y-8 animate-pop border border-white/10 p-8 rounded-2xl bg-slate-900/50 shadow-2xl">
      <div>
        <h1
          class="text-6xl font-black tracking-widest font-sans mb-2 text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-cyan-400 drop-shadow-md">
          WORDLE</h1>
        <p class="text-xl text-gray-400 font-light tracking-widest uppercase">Türkçe</p>
      </div>

      <div class="space-y-6">
        <p class="text-lg text-gray-300 font-normal">
          6 denemede <strong class="text-white font-bold">5 harfli</strong> gizli kelimeyi bul!
        </p>

        <div class="flex justify-center gap-2 mb-4">
          <div
            class="w-12 h-12 bg-gradient-to-br from-emerald-500 to-emerald-600 border border-emerald-400 text-white flex items-center justify-center font-bold text-2xl rounded-lg shadow-lg shadow-emerald-500/30">
            K</div>
          <div
            class="w-12 h-12 bg-gradient-to-br from-amber-400 to-amber-500 border border-amber-400 text-white flex items-center justify-center font-bold text-2xl rounded-lg shadow-lg shadow-amber-500/30">
            İ</div>
          <div
            class="w-12 h-12 bg-slate-700/80 border border-slate-600 text-gray-400 flex items-center justify-center font-bold text-2xl rounded-lg">
            T</div>
          <div
            class="w-12 h-12 bg-slate-800/50 border border-slate-700 text-white flex items-center justify-center font-bold text-2xl rounded-lg">
            A</div>
          <div
            class="w-12 h-12 bg-slate-800/50 border border-slate-700 text-white flex items-center justify-center font-bold text-2xl rounded-lg">
            P</div>
        </div>

        <div
          class="text-sm text-gray-400 text-left space-y-3 bg-slate-800/50 p-6 rounded-xl border border-white/5 mx-auto max-w-sm">
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></span>
            <span><strong>YEŞİL:</strong> Harf doğru yerde.</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.5)]"></span>
            <span><strong>SARI:</strong> Harf yanlış yerde.</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="w-3 h-3 rounded-full bg-slate-600"></span>
            <span><strong>GRİ:</strong> Harf kelimede yok.</span>
          </div>
        </div>
      </div>

      <button id="start-game-btn"
        class="group relative w-full max-w-xs mx-auto overflow-hidden rounded-full bg-emerald-500 p-[2px] focus:outline-none focus:ring-4 focus:ring-emerald-400/50 shadow-lg shadow-emerald-500/40 hover:scale-105 transition-transform duration-300">
        <span
          class="absolute inset-[-1000%] animate-[spin_2s_linear_infinite] bg-[conic-gradient(from_90deg_at_50%_50%,#10b981_0%,#34d399_50%,#10b981_100%)]"></span>
        <span
          class="inline-flex h-full w-full cursor-pointer items-center justify-center rounded-full bg-slate-950 px-8 py-4 text-xl font-bold text-white backdrop-blur-3xl transition-colors group-hover:bg-slate-900 group-hover:text-emerald-400">
          OYUNA BAŞLA
        </span>
      </button>
    </div>

    <div class="absolute bottom-6 text-xs text-gray-500 font-mono tracking-widest opacity-50">
      mesutx &bull; 2026
    </div>
  </div>


  <script type="module" src="/src/main.js"></script>
</body>

</html>
